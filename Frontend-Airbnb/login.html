<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Airbnb MF</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="split-container">
        <div class="image-section fondo-login">
            <div class="content-overlay">
                <h1>¡Bienvenido de vuelta!</h1>
                <p>Inicia sesión para gestionar tus reservas y descubrir nuevos lugares increíbles.</p>
            </div>
        </div>

        <div class="form-section">
            <div class="form-container">
                <img src="https://upload.wikimedia.org/wikipedia/commons/6/69/Airbnb_Logo_B%C3%A9lo.svg" alt="Logo" class="logo">
                <h2>Iniciar Sesión</h2>
                
                <form id="loginForm">
                    <div class="input-field">
                        <label>Correo Electrónico</label>
                        <input type="email" id="correo" placeholder="correo@ejemplo.com" required>
                    </div>
                    <div class="input-field">
                        <label>Contraseña</label>
                        <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
                    </div>
                    <button type="submit" class="btn-airbnb">Entrar</button>
                </form>
                
                <p class="switch-form">¿No tienes una cuenta? <a href="register.html">Regístrate aquí</a></p>
            </div>
        </div>
    </div>
    <script src="js/login.js"></script>
</body>
</html>
