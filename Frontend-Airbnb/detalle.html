<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Propiedad - Airbnb ITLA</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root {
            --primary-beige: #f5f5dc;
            --dark-almond: #dbc1ac;
            --soft-white: #fafaf9;
            --accent-red: #ff385c;
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--soft-white); margin: 0; }

        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }

        /* Título y Galería */
        .header-title { font-size: 1.6rem; margin-bottom: 15px; font-weight: 600; }
        
        .main-image {
            width: 100%;
            height: 400px;
            background-color: var(--dark-almond);
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 25px;
        }

        /* Layout de dos columnas */
        .content-layout {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 50px;
        }

        /* Columna Izquierda: Información */
        .host-info { border-bottom: 1px solid #ddd; padding-bottom: 20px; margin-bottom: 20px; }
        .description { line-height: 1.6; color: #4a4a4a; }

        /* Columna Derecha: Tarjeta de Reserva */
        .reservation-card {
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.12);
            background: white;
            position: sticky;
            top: 100px;
        }

        .price-tag { font-size: 1.4rem; font-weight: bold; margin-bottom: 20px; }

        .date-picker {
            border: 1px solid #b0b0b0;
            border-radius: 8px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            margin-bottom: 15px;
        }

        .date-input { padding: 10px; border: none; font-size: 0.8rem; }
        .date-input:first-child { border-right: 1px solid #b0b0b0; }

        .btn-reserve {
            background: var(--accent-red);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-reserve:hover { background: #e31c5f; }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="propTitle" class="header-title">Cargando...</h1>
        
        <img id="propImage" src="assets/fondo-registro.jpg" class="main-image">

       

        <div class="content-layout">
            <div class="info-column">
                <div class="host-info">
                    <h2 id="propHost">Anfitrión: ...</h2>
                    <p id="propLocation">Ubicación: ...</p>
                </div>
                <div class="description">
                    <h3>Acerca de este lugar</h3>
                    <p id="propDescription">Aquí va la descripción completa de la propiedad que viene de tu base de datos...</p>
                </div>
            </div>

            <div class="reservation-card">
                <div class="price-tag"><span id="propPrice">RD$ 0</span> <span style="font-size: 1rem; font-weight: normal;">noche</span></div>
                
                <div class="date-picker">
                    <div class="date-input">
                        <label style="font-size: 0.6rem; font-weight: bold;">LLEGADA</label><br>
                        <input type="date" id="checkin">
                    </div>
                    <div class="date-input">
                        <label style="font-size: 0.6rem; font-weight: bold;">SALIDA</label><br>
                        <input type="date" id="checkout">
                    </div>
                </div>

                <button class="btn-reserve" onclick="hacerReserva()">Reservar</button>
                <p style="text-align: center; color: #717171; font-size: 0.9rem; margin-top: 15px;">No se te cobrará nada todavía</p>
            </div>
        </div>
    </div>

    <script>
        // 1. Obtener el ID de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const propId = urlParams.get('id');

        // 2. Cargar datos de la API
        async function loadDetail() {
    try {
        const response = await fetch(`http://localhost:5189/api/Property/${propId}`);
        const p = await response.json();

        document.getElementById('propTitle').innerText = p.titulo;
        document.getElementById('propPrice').innerText = `RD$ ${p.precioNoche}`;
        document.getElementById('propDescription').innerText = p.descripcion;
        document.getElementById('propLocation').innerText = p.ubicacion;

        // ESTA ES LA LÍNEA QUE TE FALTABA:
        // Usamos p.owner.nombre (asegúrate de que coincida con tu DTO/Entidad)
        if(p.owner) {
            document.getElementById('propHost').innerText = `Anfitrión: ${p.owner.nombre}`;
        }

        // CAMBIAMOS LA IMAGEN PARA QUE USE LA DE LA BASE DE DATOS
        // Si el campo se llama imagenUrl en tu C#, ponlo igual aquí
        if(p.imagenUrl) {
            document.getElementById('propImage').src = p.imagenUrl;
        } else {
            document.getElementById('propImage').src = "assets/fondo-registro.jpg"; // Imagen por defecto
        }

    } catch (err) {
        console.error("Error al cargar detalle", err);
    }
}



        // 3. Función de Reservar 
        async function hacerReserva() {
    const checkin = document.getElementById('checkin').value;
    const checkout = document.getElementById('checkout').value;

    // Validación básica de fechas en el cliente
    if(!checkin || !checkout) {
        alert("Por favor selecciona las fechas de llegada y salida.");
        return;
    }

    // Preparamos el DTO que espera tu controlador
    const reservationDto = {
        propertyId: parseInt(propId), // Sacado de la URL
        fechaInicio: checkin,
        fechaFin: checkout,
        userId: 23 // IMPORTANTE: Ponemos 1 por ahora mientras no tengas Login activado
    };

    try {
        // Llamada real a tu API de C#
        const response = await fetch('http://localhost:5189/api/Reservation', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(reservationDto)
        });

        if (response.ok) {
            const resultado = await response.json();
            // Mensaje de éxito real
            alert(`¡Reserva Exitosa!\nTotal: RD$ ${resultado.total}\nEl correo de confirmación ha sido enviado a tu correo.`);
        } else {
            const errorTexto = await response.text();
            alert("No se pudo realizar la reserva: " + errorTexto);
        }
    } catch (err) {
        console.error("Error de conexión:", err);
        alert("Error crítico: Asegúrate de que el Backend esté encendido.");
    }
}

        window.onload = loadDetail;
    </script>
</body>
</html>
