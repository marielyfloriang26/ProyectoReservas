<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Airbnb MF</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="split-container">
        <div class="image-section fondo-registro">
            <div class="content-overlay">
                <h1>Tu próximo destino te espera</h1>
                <p>Únete a nuestra comunidad y reserva estancias únicas en todo el mundo.</p>
            </div>
        </div>
        <div class="form-section">
            <div class="form-container">
                <img src="https://upload.wikimedia.org/wikipedia/commons/6/69/Airbnb_Logo_B%C3%A9lo.svg" alt="Logo" class="logo">
                <h2>Crear Cuenta</h2>
                <form id="registerForm">
                    <div class="input-field">
                        <label>Nombre Completo</label>
                        <input type="text" id="nombre" placeholder="Ej. Mariely Florian" required>
                    </div>
                    <div class="input-field">
                        <label>Correo Electrónico</label>
                        <input type="email" id="correo" placeholder="correo@ejemplo.com" required>
                    </div>
                    <div class="input-field">
                        <label>Contraseña</label>
                        <input type="password" id="password" placeholder="Crea una contraseña" required>
                    </div>
                    <button type="submit" class="btn-airbnb">Registrarse</button>
                </form>
                <p class="switch-form">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
            </div>
        </div>
    </div>
    <script src="js/register.js"></script>
</body>
</html>
